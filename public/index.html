<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logs Kibana</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='5' fill='%232563eb'/%3E%3Cpath d='M4.5 13h3.5l2-5.5 3 10 2-4.5h4.5' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --soft: #f0f2f5; --text: #1b2130; --muted: #687085; --faint: #9aa1b2; --border: #e2e5eb;
    --accent: #2563eb; --on-accent: #ffffff; --accent-soft: #e8efff; --sel: #dfe8ff;
    --warn: #a15c00; --warn-bar: #e8a33d; --error: #c81e1e; --error-bar: #e5484d; --info: #0f766e; --mark: #fff0a0;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1218; --panel: #161a22; --soft: #1d222c; --text: #e0e5ee; --muted: #8d95a7; --faint: #5d6576; --border: #272d39;
      --accent: #5b93ff; --on-accent: #0b0e13; --accent-soft: #1a2540; --sel: #1f2c4a;
      --warn: #f0b44c; --warn-bar: #c98a2b; --error: #ff7070; --error-bar: #e5484d; --info: #4fd1c5; --mark: #5b4b00;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1218; --panel: #161a22; --soft: #1d222c; --text: #e0e5ee; --muted: #8d95a7; --faint: #5d6576; --border: #272d39;
    --accent: #5b93ff; --on-accent: #0b0e13; --accent-soft: #1a2540; --sel: #1f2c4a;
    --warn: #f0b44c; --warn-bar: #c98a2b; --error: #ff7070; --error-bar: #e5484d; --info: #4fd1c5; --mark: #5b4b00;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  .mono { font-family: ui-monospace, Consolas, "Cascadia Mono", monospace; }

  /* ---------- cabeçalho ---------- */
  header { background: var(--panel); border-bottom: 1px solid var(--border); box-shadow: var(--shadow); padding: 10px 16px; display: grid; gap: 8px; position: relative; z-index: 2; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; margin-right: 4px; white-space: nowrap; }
  .brand svg { width: 24px; height: 24px; flex: none; }
  .brand rect { fill: var(--accent); } .brand path { stroke: var(--panel); }
  input, select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 7px; height: 32px; padding: 0 10px; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
  input::placeholder { color: var(--faint); }
  #url { flex: 2 1 280px; }
  .search { flex: 3 1 340px; position: relative; display: flex; }
  .search svg { position: absolute; left: 9px; top: 8px; width: 16px; height: 16px; stroke: var(--faint); }
  .search input { flex: 1; padding-left: 32px; padding-right: 30px; }
  .search kbd { position: absolute; right: 7px; top: 6px; font: 11px ui-monospace, monospace; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
  button { cursor: pointer; white-space: nowrap; }
  button:hover { background: var(--soft); }
  button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); background: var(--accent); }
  button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  button.icon { width: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  button.icon svg { width: 16px; height: 16px; stroke: currentColor; }
  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-right: 6px; vertical-align: 1px; }
  button.on .live-dot { background: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; max-height: 56px; overflow: auto; }
  .chip { background: var(--soft); border: 1px solid transparent; border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; user-select: none; }
  .chip:hover { border-color: var(--border); }
  .chip.sel { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip small { color: var(--muted); margin-left: 4px; font-weight: 400; }
  .status { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  .status.err { color: var(--error); white-space: normal; }
  .hint { color: var(--muted); font-size: 12px; }

  /* ---------- lista + painel ---------- */
  .work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); }
  .work.has-panel { grid-template-columns: minmax(0, 1fr) minmax(360px, 42%); }
  main { overflow: auto; min-height: 0; font: 12.5px/1.45 ui-monospace, Consolas, "Cascadia Mono", monospace; }
  .line { display: grid; grid-template-columns: 3px 92px 130px minmax(0, 1fr); gap: 10px; padding: 4px 14px 4px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .line:hover { background: var(--soft); }
  .line.sel { background: var(--sel); }
  .bar { align-self: stretch; }
  .lv-warn .bar { background: var(--warn-bar); } .lv-error .bar { background: var(--error-bar); }
  .ts { color: var(--muted); white-space: nowrap; }
  .ts .d { display: block; font-size: 10.5px; color: var(--faint); }
  .ct { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg { white-space: pre-wrap; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .lv-warn .msg { color: var(--warn); } .lv-error .msg { color: var(--error); }
  .a31, .a91 { color: var(--error); } .a33, .a93 { color: var(--warn); } .a32, .a92, .a36, .a96 { color: var(--info); }
  .a90, .a37 { color: var(--muted); } .a1 { font-weight: 700; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }

  aside { border-left: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .p-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .p-head .t { font: 12px ui-monospace, monospace; color: var(--muted); }
  .p-head .c { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; font-weight: 600; border-radius: 4px; padding: 1px 6px; text-transform: uppercase; }
  .badge.warn { color: var(--warn); background: color-mix(in srgb, var(--warn-bar) 18%, transparent); }
  .badge.error { color: var(--error); background: color-mix(in srgb, var(--error-bar) 18%, transparent); }
  .p-head .close { margin-left: auto; }
  .p-actions { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .p-actions button { height: 28px; font-size: 12px; padding: 0 9px; }
  .p-body { overflow: auto; padding: 12px; display: grid; gap: 12px; align-content: start; }
  .p-label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .p-msg { font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all; background: var(--soft); border-radius: 7px; padding: 10px; max-height: 30vh; overflow: auto; }

  .jtree { font: 12px/1.55 ui-monospace, Consolas, monospace; background: var(--soft); border-radius: 7px; padding: 10px; overflow: auto; }
  .jl { white-space: pre-wrap; word-break: break-all; padding-left: 26px; }
  .jhead { cursor: pointer; padding-left: 0; border-radius: 4px; }
  .jhead:hover { background: var(--accent-soft); }
  .jt { display: inline-block; width: 26px; color: var(--accent); font-weight: 700; user-select: none; }
  .jt::before { content: '[-]'; }
  .jn.closed > .jhead .jt::before { content: '[+]'; }
  .jc { padding-left: 18px; border-left: 1px dotted var(--border); margin-left: 8px; }
  .jn.closed > .jc, .jn.closed > .jclose { display: none; }
  .jn:not(.closed) > .jhead .jsum { display: none; }
  .jsum, .jnote { color: var(--muted); font-style: italic; }
  .jnote { font-size: 11px; }
  .jk { color: var(--accent); }
  .js { color: var(--info); } .jnum { color: var(--warn); } .jb, .jnull { color: var(--error); }

  .empty { padding: 56px 16px; color: var(--muted); text-align: center; font: 14px/1.6 system-ui, sans-serif; }
  .empty svg { width: 44px; height: 44px; margin-bottom: 8px; }
  .empty svg rect { fill: var(--accent); } .empty svg path { stroke: var(--panel); }
  .empty h3 { color: var(--text); font-size: 16px; font-weight: 600; margin: 0 0 6px; }
  .empty code { font: 12px ui-monospace, monospace; background: var(--soft); border-radius: 4px; padding: 1px 5px; color: var(--text); }
  .syntax { display: grid; grid-template-columns: auto auto; gap: 4px 14px; text-align: left; margin: 16px auto 0; width: max-content; max-width: 100%; font-size: 13px; }

  @media (max-width: 900px) {
    .work.has-panel { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 55%); }
    aside { border-left: 0; border-top: 1px solid var(--border); }
    .line { grid-template-columns: 3px 80px minmax(0, 1fr); }
    .line .ct { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="brand" title="Logs Kibana">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="5"/><path d="M4.5 13h3.5l2-5.5 3 10 2-4.5h4.5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Logs
    </div>
    <input id="url" list="clientes" placeholder="https://cliente.weon.com.br/kibana" aria-label="URL do Kibana do cliente">
    <datalist id="clientes"></datalist>
    <select id="periodo" title="Período">
      <option value="now-15m">Últimos 15 min</option>
      <option value="now-1h" selected>Última 1 h</option>
      <option value="now-4h">Últimas 4 h</option>
      <option value="now-24h">Último 1 dia</option>
      <option value="now-7d">Últimos 7 dias</option>
      <option value="custom">Personalizado…</option>
    </select>
    <span id="custom" class="row" hidden>
      <input id="de" type="datetime-local" step="1" title="De"><input id="ate" type="datetime-local" step="1" title="Até">
    </span>
    <select id="tamanho" title="Máximo de linhas">
      <option>100</option><option selected>300</option><option>1000</option><option>2000</option>
    </select>
    <button id="tema" class="icon" title="Alternar tema claro/escuro" aria-label="Alternar tema">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
  <div class="row">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" class="mono" placeholder='i0Gdn0 "Ticket inexistente" SEND_* OR error -debug' title='a b = E · "frase exata" · a OR b = OU · abc* / a?c = curinga · -termo = exclui'>
      <kbd>/</kbd>
    </div>
    <button id="buscar" class="primary">Buscar</button>
    <button id="vivo" title="Atualiza a cada 3 s"><span class="live-dot"></span>Ao vivo</button>
    <button id="selecao" title="Adiciona o texto selecionado ao filtro">+ Seleção</button>
  </div>
  <div class="row">
    <div id="chips" class="chips"><span class="hint">Os containers aparecem depois da primeira busca.</span></div>
    <span id="status" class="status"></span>
  </div>
</header>

<div id="work" class="work">
  <main id="lista">
    <div class="empty">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="5"/><path d="M4.5 13h3.5l2-5.5 3 10 2-4.5h4.5" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h3>Escolha um cliente</h3>
      Informe a URL do Kibana do cliente e aperte Enter.
      <div class="syntax">
        <code>a b</code><span>as duas palavras</span>
        <code>a OR b</code><span>uma ou outra</span>
        <code>"frase exata"</code><span>o trecho inteiro</span>
        <code>SEND_*</code><span>curinga na palavra</span>
        <code>-termo</code><span>exclui</span>
        <code>/</code><span>vai para o filtro · ↑↓ navega · Esc fecha</span>
      </div>
    </div>
  </main>
  <aside id="painel" hidden></aside>
</div>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

let selected = new Set();  // containers ligados
let lines = [];            // {id, ts, container, message}
let seen = new Set();
let current = null;        // id da linha aberta no painel
let liveTimer = null;
let busy = false;

// ---------- tema ----------
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
applyTheme(store.get('tema', null));
$('tema').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === 'dark'
    : matchMedia('(prefers-color-scheme: dark)').matches;
  const t = dark ? 'light' : 'dark';
  applyTheme(t); store.set('tema', t);
});

// ---------- estado na URL (#...) para favoritar uma busca ----------
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('url')) $('url').value = p.get('url');
  $('q').value = p.get('q') || '';
  if (p.get('p')) $('periodo').value = p.get('p');
  selected = new Set((p.get('c') || '').split(',').filter(Boolean));
}
function writeHash() {
  const p = new URLSearchParams();
  if ($('url').value) p.set('url', $('url').value.trim());
  if ($('q').value) p.set('q', $('q').value);
  if ($('periodo').value !== 'custom') p.set('p', $('periodo').value);
  if (selected.size) p.set('c', [...selected].join(','));
  history.replaceState(null, '', '#' + p.toString());
}
window.addEventListener('hashchange', () => { readHash(); if ($('url').value) { search(); loadContainers(); } });

function rememberClient(url) {
  const list = store.get('clientes', []).filter(u => u !== url);
  list.unshift(url);
  store.set('clientes', list.slice(0, 30));
  renderClients();
}
function renderClients() {
  $('clientes').innerHTML = store.get('clientes', []).map(u => `<option value="${esc(u)}">`).join('');
}

function range() {
  if ($('periodo').value !== 'custom') return { from: $('periodo').value, to: 'now' };
  const iso = v => v ? new Date(v).toISOString() : undefined;
  return { from: iso($('de').value) || 'now-1h', to: iso($('ate').value) || 'now' };
}

async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
  return j;
}

function setStatus(text, err) { $('status').textContent = text; $('status').className = 'status' + (err ? ' err' : ''); }

// ---------- containers ----------
async function loadContainers() {
  const url = $('url').value.trim();
  if (!url) return;
  try {
    const { containers } = await api('/api/containers', { url, ...range() });
    const names = new Set(containers.map(c => c.name));
    selected.forEach(s => { if (!names.has(s)) containers.push({ name: s, count: 0 }); });
    $('chips').innerHTML = containers.map(c =>
      `<span class="chip${selected.has(c.name) ? ' sel' : ''}" data-c="${esc(c.name)}">${esc(c.name)}<small>${c.count.toLocaleString('pt-BR')}</small></span>`).join('')
      || '<span class="hint">Nenhum container com logs nesse período.</span>';
  } catch (e) {
    $('chips').innerHTML = `<span class="hint">Containers não carregaram: ${esc(e.message)}</span>`;
  }
}
$('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const c = chip.dataset.c;
  selected.has(c) ? selected.delete(c) : selected.add(c);
  chip.classList.toggle('sel');
  search();
});

// ---------- busca ----------
async function search() {
  const url = $('url').value.trim();
  if (!url) { setStatus('Informe a URL do cliente', true); $('url').focus(); return; }
  writeHash();
  busy = true;
  setStatus('Buscando…');
  const t0 = performance.now();
  try {
    const r = await api('/api/search', { url, q: $('q').value, containers: [...selected], size: $('tamanho').value, ...range() });
    rememberClient(url);
    lines = r.hits; seen = new Set(lines.map(l => l.id));
    render(true);
    setStatus(`${lines.length.toLocaleString('pt-BR')} de ${Number(String(r.total).replace('+', '')).toLocaleString('pt-BR')}${String(r.total).endsWith('+') ? '+' : ''} linhas · ${Math.round(performance.now() - t0)} ms`);
  } catch (e) {
    setStatus(e.message, true);
  } finally { busy = false; }
}

async function poll() {
  if (busy || !lines.length) return;
  busy = true;
  try {
    const after = lines[lines.length - 1].ts;
    const r = await api('/api/search', { url: $('url').value.trim(), q: $('q').value, containers: [...selected], size: 500, after, from: after, to: 'now' });
    const novos = r.hits.filter(h => !seen.has(h.id));
    if (novos.length) {
      const main = $('lista');
      const atBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 40;
      novos.forEach(h => seen.add(h.id));
      lines.push(...novos);
      const max = Number($('tamanho').value) * 2;
      if (lines.length > max) lines = lines.slice(-max);
      render(atBottom);
    }
    setStatus(`${lines.length.toLocaleString('pt-BR')} linhas · ao vivo · ${new Date().toLocaleTimeString('pt-BR')}`);
  } catch (e) {
    setStatus('Ao vivo: ' + e.message, true);
  } finally { busy = false; }
}

$('vivo').addEventListener('click', () => {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; $('vivo').classList.remove('on'); return; }
  $('vivo').classList.add('on');
  liveTimer = setInterval(poll, 3000);
  if (!lines.length) search();
});

// ---------- render da lista ----------
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// Códigos ANSI chegam com ou sem o ESC ("[33m"). Viram classes de cor.
function ansi(text) {
  const parts = String(text ?? '').split(/\u001b?\[((?:\d{1,3};?)+)m/);
  let out = '', open = 0;
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) { out += highlight(esc(parts[i])); continue; }
    const codes = parts[i].split(';').filter(Boolean);
    if (codes.includes('0') || codes.includes('39') || codes.includes('22')) { out += '</span>'.repeat(open); open = 0; continue; }
    out += `<span class="${codes.map(c => 'a' + c).join(' ')}">`; open++;
  }
  return out + '</span>'.repeat(open);
}

// Termos positivos do filtro como regex (curinga * e ? viram \S* e \S).
function terms() {
  return [...($('q').value.matchAll(/(-?)"([^"]+)"|(-?)(\S+)/g))]
    .filter(m => !(m[1] || m[3]) && !(m[4] === 'OR'))
    .map(m => {
      const quoted = m[2] !== undefined;
      const rx = esc(quoted ? m[2] : m[4]).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return quoted ? rx : rx.replace(/\\\*/g, '\\S*').replace(/\\\?/g, '\\S');
    })
    .filter(rx => rx.replace(/\\S\*?/g, '').length > 0);
}
let termRe = null;
function highlight(html) {
  return termRe ? html.replace(termRe, '<mark>$&</mark>') : html;
}

function level(msg) {
  const m = /\[(error|err|warn|warning|info|debug|trace)\]/i.exec(msg || '') || /\b(ERROR|WARN)\b/.exec(msg || '');
  if (!m) return '';
  const l = m[1].toLowerCase();
  return l.startsWith('err') ? 'error' : l.startsWith('warn') ? 'warn' : '';
}

function fmtTs(ts) {
  const d = new Date(ts);
  const t = d.toLocaleTimeString('pt-BR', { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
  return `${t}<span class="d">${d.toLocaleDateString('pt-BR')}</span>`;
}

function render(scrollBottom) {
  const ts = terms();
  termRe = ts.length ? new RegExp(ts.join('|'), 'gi') : null;
  const main = $('lista');
  if (!lines.length) {
    main.innerHTML = `<div class="empty"><h3>Nada encontrado</h3>Nenhuma linha bate com esse filtro no período.<br>Tente aumentar o período, tirar um container ou afrouxar o filtro.</div>`;
    closePanel();
    return;
  }
  main.innerHTML = lines.map((l, i) => {
    const lv = level(l.message);
    return `<div class="line${lv ? ' lv-' + lv : ''}${l.id === current ? ' sel' : ''}" data-i="${i}"><span class="bar"></span><span class="ts">${fmtTs(l.ts)}</span><span class="ct" title="${esc(l.container)}">${esc(l.container)}</span><span class="msg">${ansi(l.message)}</span></div>`;
  }).join('');
  if (current && !lines.some(l => l.id === current)) closePanel();
  if (scrollBottom) main.scrollTop = main.scrollHeight;
}

// ---------- painel de detalhe ----------
// Acha o JSON dentro da mensagem: tenta os primeiros "{" / "[{" contra os últimos "}" / "]".
function extractJson(msg) {
  const clean = String(msg ?? '').replace(/\u001b?\[(?:\d{1,3};?)+m/g, '');
  const starts = [...clean.matchAll(/\{|\[(?=\s*\{)/g)].slice(0, 8).map(m => m.index);
  const ends = [];
  for (let j = clean.length; j > 0 && ends.length < 8; j--) if (clean[j - 1] === '}' || clean[j - 1] === ']') ends.push(j);
  for (const i of starts) for (const j of ends) {
    if (j <= i) continue;
    try { return JSON.parse(clean.slice(i, j)); } catch (e) {}
  }
  return null;
}

// Árvore do JSON: objetos/arrays com [+]/[-]; abre até o 2º nível. Texto que é JSON vira nó também.
function jsonTree(val, key, depth) {
  const k = key !== undefined ? `<span class="jk">${esc(key)}</span>: ` : '';
  let v = val, note = '';
  if (typeof v === 'string') {
    const t = v.trim();
    if (t[0] === '{' || t[0] === '[') {
      try { const p = JSON.parse(t); if (p && typeof p === 'object') { v = p; note = '<span class="jnote">texto JSON</span> '; } } catch (e) {}
    }
  }
  if (v === null || typeof v !== 'object') return `<div class="jl">${k}${jsonValue(v)}</div>`;
  const arr = Array.isArray(v);
  const entries = arr ? v.map((x, i) => [i, x]) : Object.entries(v);
  const [o, c] = arr ? ['[', ']'] : ['{', '}'];
  if (!entries.length) return `<div class="jl">${k}${note}${o}${c}</div>`;
  const sum = arr ? `${entries.length} ${entries.length === 1 ? 'item' : 'itens'}` : `${entries.length} ${entries.length === 1 ? 'chave' : 'chaves'}`;
  return `<div class="jn${depth >= 2 ? ' closed' : ''}">`
    + `<div class="jl jhead"><span class="jt"></span>${k}${note}${o}<span class="jsum"> ${sum} ${c}</span></div>`
    + `<div class="jc">${entries.map(([ck, cv]) => jsonTree(cv, ck, depth + 1)).join('')}</div>`
    + `<div class="jl jclose">${c}</div></div>`;
}
function jsonValue(v) {
  if (v === null) return '<span class="jnull">null</span>';
  if (typeof v === 'string') return `<span class="js">"${highlight(esc(v))}"</span>`;
  if (typeof v === 'number') return `<span class="jnum">${v}</span>`;
  return `<span class="jb">${v}</span>`;
}

function openPanel(i) {
  const l = lines[i];
  if (!l) return;
  current = l.id;
  document.querySelectorAll('.line.sel').forEach(n => n.classList.remove('sel'));
  const row = document.querySelector(`.line[data-i="${i}"]`);
  if (row) { row.classList.add('sel'); row.scrollIntoView({ block: 'nearest' }); }

  const lv = level(l.message);
  const json = extractJson(l.message);
  const d = new Date(l.ts);
  const p = $('painel');
  p.innerHTML = `
    <div class="p-head">
      <div style="min-width:0"><div class="c" title="${esc(l.container)}">${esc(l.container)}</div>
      <div class="t">${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR', { hour12: false })}.${String(d.getMilliseconds()).padStart(3, '0')}</div></div>
      ${lv ? `<span class="badge ${lv}">${lv}</span>` : ''}
      <button class="icon close" data-a="close" title="Fechar (Esc)" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="p-actions">
      <button data-a="copy">Copiar mensagem</button>
      ${json ? '<button data-a="copyjson">Copiar JSON</button><button data-a="expand">[+] Expandir</button><button data-a="collapse">[-] Recolher</button>' : ''}
      <button data-a="ctx">±30 s deste container</button>
    </div>
    <div class="p-body">
      <div><div class="p-label">Mensagem</div><div class="p-msg">${ansi(l.message)}</div></div>
      ${json ? `<div><div class="p-label">JSON</div><div class="jtree">${jsonTree(json, undefined, 0)}</div></div>` : ''}
    </div>`;
  p.hidden = false;
  $('work').classList.add('has-panel');

  p.querySelector('.p-actions').onclick = p.querySelector('.p-head').onclick = ev => {
    const a = ev.target.closest('[data-a]')?.dataset.a;
    if (a === 'close') closePanel();
    if (a === 'copy') copy(l.message, ev.target);
    if (a === 'copyjson') copy(JSON.stringify(json, null, 2), ev.target);
    if (a === 'expand') p.querySelectorAll('.jn').forEach(n => n.classList.remove('closed'));
    if (a === 'collapse') p.querySelectorAll('.jtree > .jn .jn').forEach(n => n.classList.add('closed'));
    if (a === 'ctx') {
      const t = d.getTime();
      const toLocal = ms => new Date(ms - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 19);
      $('periodo').value = 'custom'; $('custom').hidden = false;
      $('de').value = toLocal(t - 30000); $('ate').value = toLocal(t + 30000);
      $('q').value = ''; selected = new Set([l.container]);
      loadContainers(); search();
    }
  };
  const tree = p.querySelector('.jtree');
  if (tree) tree.onclick = ev => {
    const head = ev.target.closest('.jhead');
    if (head && !String(window.getSelection())) head.parentElement.classList.toggle('closed');
  };
}

function closePanel() {
  current = null;
  $('painel').hidden = true;
  $('work').classList.remove('has-panel');
  document.querySelectorAll('.line.sel').forEach(n => n.classList.remove('sel'));
}

function copy(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const old = btn.textContent; btn.textContent = 'Copiado'; setTimeout(() => { btn.textContent = old; }, 1200);
  });
}

$('lista').addEventListener('click', e => {
  if (String(window.getSelection())) return; // selecionando texto, não abre
  const row = e.target.closest('.line');
  if (!row) return;
  if (lines[row.dataset.i]?.id === current) closePanel(); else openPanel(Number(row.dataset.i));
});

function addToFilter(text) {
  text = text.trim();
  if (!text) return;
  const t = /\s/.test(text) ? `"${text.replace(/"/g, '')}"` : text;
  $('q').value = ($('q').value.trim() + ' ' + t).trim();
  search();
}
$('lista').addEventListener('dblclick', e => {
  if (!e.target.closest('.msg')) return;
  addToFilter(String(window.getSelection()));
  window.getSelection().removeAllRanges();
});
$('painel').addEventListener('dblclick', e => {
  if (!e.target.closest('.p-msg, .js')) return;
  addToFilter(String(window.getSelection()).replace(/^"|"$/g, ''));
  window.getSelection().removeAllRanges();
});
$('selecao').addEventListener('click', () => addToFilter(String(window.getSelection())));

// ---------- teclado ----------
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('q').focus(); $('q').select(); return; }
  if (e.key === 'Escape') { if (typing) document.activeElement.blur(); else closePanel(); return; }
  if (typing || !lines.length || !(e.key === 'ArrowDown' || e.key === 'ArrowUp')) return;
  e.preventDefault();
  const i = lines.findIndex(l => l.id === current);
  const next = i < 0 ? (e.key === 'ArrowDown' ? 0 : lines.length - 1) : Math.max(0, Math.min(lines.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
  openPanel(next);
});

// ---------- eventos ----------
$('buscar').addEventListener('click', () => { search(); loadContainers(); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') { selected.clear(); search(); loadContainers(); } });
$('url').addEventListener('change', () => { selected.clear(); loadContainers(); });
$('periodo').addEventListener('change', () => { $('custom').hidden = $('periodo').value !== 'custom'; if ($('periodo').value !== 'custom') { search(); loadContainers(); } });
$('de').addEventListener('change', search); $('ate').addEventListener('change', search);
$('tamanho').addEventListener('change', search);

renderClients();
readHash();
if ($('url').value) { search(); loadContainers(); }
</script>
</body>
</html>
