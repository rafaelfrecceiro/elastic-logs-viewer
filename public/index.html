<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logs Kibana</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --border: #dfe3ea;
    --accent: #2563eb; --accent-text: #ffffff; --row-hover: #eef3ff; --row-open: #e6eeff;
    --warn: #a15c00; --error: #c81e1e; --info: #0f766e; --debug: #6b7385; --chip: #eef1f6;
    --mark: #fff1a8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1e26; --text: #dfe4ee; --muted: #8b93a5; --border: #2b313d;
      --accent: #4f8cff; --accent-text: #0b0e13; --row-hover: #20283a; --row-open: #232d44;
      --warn: #f0b44c; --error: #ff6b6b; --info: #4fd1c5; --debug: #8b93a5; --chip: #262c38;
      --mark: #5b4b00;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 16px; display: grid; gap: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #url { flex: 2 1 320px; }
  #q { flex: 3 1 320px; font-family: ui-monospace, Consolas, monospace; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; max-height: 64px; overflow: auto; }
  .chip { background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; user-select: none; }
  .chip.sel { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip small { color: var(--muted); margin-left: 4px; }
  .status { color: var(--muted); font-size: 12px; }
  .status.err { color: var(--error); }
  main { flex: 1; overflow: auto; font: 12.5px/1.45 ui-monospace, Consolas, "Cascadia Mono", monospace; }
  .line { display: grid; grid-template-columns: 96px 130px 1fr; gap: 10px; padding: 3px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .line:hover { background: var(--row-hover); }
  .line.open { background: var(--row-open); }
  .ts { color: var(--muted); white-space: nowrap; }
  .ts .d { display: block; font-size: 10.5px; }
  .ct { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg { white-space: pre-wrap; word-break: break-all; }
  .line:not(.open) .msg { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .lv-warn .msg { color: var(--warn); }
  .lv-error .msg { color: var(--error); }
  .a31, .a91 { color: var(--error); } .a33, .a93 { color: var(--warn); } .a32, .a92 { color: var(--info); }
  .a36, .a96 { color: var(--info); } .a90, .a37 { color: var(--debug); } .a1 { font-weight: 700; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; }
  .jtree { grid-column: 1 / -1; margin: 6px 0 4px; padding: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: auto; max-height: 60vh; cursor: text; }
  .jl { white-space: pre-wrap; word-break: break-all; padding-left: 26px; }
  .jhead { cursor: pointer; padding-left: 0; }
  .jhead:hover { background: var(--row-hover); }
  .jt { display: inline-block; width: 26px; color: var(--accent); font-weight: 700; user-select: none; }
  .jt::before { content: '[-]'; }
  .jn.closed > .jhead .jt::before { content: '[+]'; }
  .jc { padding-left: 18px; border-left: 1px dotted var(--border); margin-left: 8px; }
  .jn.closed > .jc, .jn.closed > .jclose { display: none; }
  .jn:not(.closed) > .jhead .jsum { display: none; }
  .jsum, .jnote { color: var(--muted); font-style: italic; }
  .jnote { font-size: 11px; }
  .jk { color: var(--accent); }
  .js { color: var(--info); } .jnum { color: var(--warn); } .jb, .jnull { color: var(--error); }
  .actions { grid-column: 1 / -1; display: flex; gap: 8px; }
  .actions button { font-size: 12px; padding: 2px 8px; }
  .empty { padding: 40px 16px; color: var(--muted); text-align: center; font-family: system-ui, sans-serif; }
  .hint { color: var(--muted); font-size: 12px; }
  @media (max-width: 700px) {
    .line { grid-template-columns: 1fr; gap: 0; }
    .ct { white-space: normal; }
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <input id="url" list="clientes" placeholder="URL do cliente (ex.: https://cliente.weon.com.br/kibana)">
    <datalist id="clientes"></datalist>
    <select id="periodo" title="Período">
      <option value="now-15m">Últimos 15 min</option>
      <option value="now-1h" selected>Última 1 h</option>
      <option value="now-4h">Últimas 4 h</option>
      <option value="now-24h">Último 1 dia</option>
      <option value="now-7d">Últimos 7 dias</option>
      <option value="custom">Personalizado…</option>
    </select>
    <span id="custom" class="row" hidden>
      <input id="de" type="datetime-local" step="1" title="De"> <input id="ate" type="datetime-local" step="1" title="Até">
    </span>
    <select id="tamanho" title="Linhas">
      <option>100</option><option selected>300</option><option>1000</option><option>2000</option>
    </select>
  </div>
  <div class="row">
    <input id="q" placeholder='Filtro: i0Gdn0 "Ticket inexistente" SEND_* OR error -debug' title='a b = E · "frase exata" · a OR b = OU · abc* / a?c = curinga · -termo = exclui'>
    <button id="buscar" class="primary">Buscar</button>
    <button id="vivo" title="Atualiza a cada 3 s">▶ Ao vivo</button>
    <button id="selecao" title="Adiciona o texto selecionado ao filtro">+ Seleção no filtro</button>
  </div>
  <div class="row">
    <span class="hint">Containers:</span>
    <div id="chips" class="chips"><span class="hint">informe a URL e busque</span></div>
  </div>
  <div class="row"><span id="status" class="status"></span></div>
</header>
<main id="lista"><div class="empty">Informe a URL do Kibana do cliente e clique em Buscar.<br>Duplo clique numa palavra do log adiciona ao filtro; clique na linha abre o detalhe.</div></main>

<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

let selected = new Set();
let lines = [];          // {id, ts, container, message}
let seen = new Set();
let liveTimer = null;
let busy = false;

// ---------- estado na URL (#...) para favoritar uma busca ----------
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get('url')) $('url').value = p.get('url');
  if (p.get('q')) $('q').value = p.get('q');
  if (p.get('p')) $('periodo').value = p.get('p');
  if (p.get('c')) selected = new Set(p.get('c').split(',').filter(Boolean));
}
function writeHash() {
  const p = new URLSearchParams();
  if ($('url').value) p.set('url', $('url').value.trim());
  if ($('q').value) p.set('q', $('q').value);
  if ($('periodo').value !== 'custom') p.set('p', $('periodo').value);
  if (selected.size) p.set('c', [...selected].join(','));
  history.replaceState(null, '', '#' + p.toString());
}
window.addEventListener('hashchange', () => { readHash(); if ($('url').value) { search(); loadContainers(); } });

function rememberClient(url) {
  const list = store.get('clientes', []).filter(u => u !== url);
  list.unshift(url);
  store.set('clientes', list.slice(0, 30));
  renderClients();
}
function renderClients() {
  $('clientes').innerHTML = store.get('clientes', []).map(u => `<option value="${esc(u)}">`).join('');
}

function range() {
  if ($('periodo').value !== 'custom') return { from: $('periodo').value, to: 'now' };
  const iso = v => v ? new Date(v).toISOString() : undefined;
  return { from: iso($('de').value) || 'now-1h', to: iso($('ate').value) || 'now' };
}

async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
  return j;
}

function setStatus(text, err) { $('status').textContent = text; $('status').className = 'status' + (err ? ' err' : ''); }

// ---------- containers ----------
async function loadContainers() {
  const url = $('url').value.trim();
  if (!url) return;
  try {
    const { containers } = await api('/api/containers', { url, ...range() });
    const names = new Set(containers.map(c => c.name));
    selected.forEach(s => { if (!names.has(s)) containers.push({ name: s, count: 0 }); });
    $('chips').innerHTML = containers.map(c =>
      `<span class="chip${selected.has(c.name) ? ' sel' : ''}" data-c="${esc(c.name)}">${esc(c.name)}<small>${c.count}</small></span>`).join('')
      || '<span class="hint">nenhum container no período</span>';
  } catch (e) {
    $('chips').innerHTML = `<span class="hint">não carregou: ${esc(e.message)}</span>`;
  }
}
$('chips').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const c = chip.dataset.c;
  selected.has(c) ? selected.delete(c) : selected.add(c);
  chip.classList.toggle('sel');
  search();
});

// ---------- busca ----------
async function search() {
  const url = $('url').value.trim();
  if (!url) { setStatus('Informe a URL do cliente', true); return; }
  writeHash();
  busy = true;
  setStatus('Buscando…');
  const t0 = performance.now();
  try {
    const r = await api('/api/search', { url, q: $('q').value, containers: [...selected], size: $('tamanho').value, ...range() });
    rememberClient(url);
    lines = r.hits; seen = new Set(lines.map(l => l.id));
    render(true);
    setStatus(`${r.base} · ${lines.length} de ${r.total ?? '?'} linhas · ${Math.round(performance.now() - t0)} ms` + (live() ? ' · ao vivo' : ''));
  } catch (e) {
    setStatus(e.message, true);
  } finally { busy = false; }
}

async function poll() {
  if (busy || !lines.length) return;
  busy = true;
  try {
    const after = lines[lines.length - 1].ts;
    const r = await api('/api/search', { url: $('url').value.trim(), q: $('q').value, containers: [...selected], size: 500, after, from: after, to: 'now' });
    const novos = r.hits.filter(h => !seen.has(h.id));
    if (novos.length) {
      const main = $('lista');
      const atBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 40;
      novos.forEach(h => seen.add(h.id));
      lines.push(...novos);
      const max = Number($('tamanho').value) * 2;
      if (lines.length > max) lines = lines.slice(-max);
      render(atBottom);
    }
    setStatus(`${r.base} · ${lines.length} linhas · ao vivo, atualizado ${new Date().toLocaleTimeString('pt-BR')}`);
  } catch (e) {
    setStatus('Ao vivo: ' + e.message, true);
  } finally { busy = false; }
}

const live = () => !!liveTimer;
$('vivo').addEventListener('click', () => {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; $('vivo').classList.remove('on'); $('vivo').textContent = '▶ Ao vivo'; return; }
  $('vivo').classList.add('on'); $('vivo').textContent = '❚❚ Parar';
  liveTimer = setInterval(poll, 3000);
  if (!lines.length) search();
});

// ---------- render ----------
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// Códigos ANSI chegam com ou sem o ESC ("[33m"). Viram classes de cor.
function ansi(text) {
  const parts = String(text ?? '').split(/\u001b?\[((?:\d{1,3};?)+)m/);
  let out = '', open = 0;
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) { out += highlight(esc(parts[i])); continue; }
    const codes = parts[i].split(';').filter(Boolean);
    if (codes.includes('0') || codes.includes('39') || codes.includes('22')) { out += '</span>'.repeat(open); open = 0; continue; }
    out += `<span class="${codes.map(c => 'a' + c).join(' ')}">`; open++;
  }
  return out + '</span>'.repeat(open);
}

// Termos positivos do filtro como regex (curinga * e ? viram \S* e \S).
function terms() {
  return [...($('q').value.matchAll(/(-?)"([^"]+)"|(-?)(\S+)/g))]
    .filter(m => !(m[1] || m[3]) && !(m[4] === 'OR'))
    .map(m => {
      const quoted = m[2] !== undefined;
      const rx = esc(quoted ? m[2] : m[4]).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return quoted ? rx : rx.replace(/\\\*/g, '\\S*').replace(/\\\?/g, '\\S');
    })
    .filter(rx => rx.replace(/\\S\*?/g, '').length > 0);
}
let termRe = null;
function highlight(html) {
  return termRe ? html.replace(termRe, '<mark>$&</mark>') : html;
}

function level(msg) {
  const m = /\[(error|err|warn|warning|info|debug|trace)\]/i.exec(msg || '') || /\b(ERROR|WARN)\b/.exec(msg || '');
  if (!m) return '';
  const l = m[1].toLowerCase();
  return l.startsWith('err') ? 'lv-error' : l.startsWith('warn') ? 'lv-warn' : '';
}

function fmtTs(ts) {
  const d = new Date(ts);
  const t = d.toLocaleTimeString('pt-BR', { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
  return `${t}<span class="d">${d.toLocaleDateString('pt-BR')}</span>`;
}

function render(scrollBottom) {
  const ts = terms();
  termRe = ts.length ? new RegExp(ts.join('|'), 'gi') : null;
  const main = $('lista');
  if (!lines.length) { main.innerHTML = '<div class="empty">Nada encontrado com esses filtros no período.</div>'; return; }
  main.innerHTML = lines.map((l, i) =>
    `<div class="line ${level(l.message)}" data-i="${i}"><span class="ts">${fmtTs(l.ts)}</span><span class="ct" title="${esc(l.container)}">${esc(l.container)}</span><span class="msg">${ansi(l.message)}</span></div>`
  ).join('');
  if (scrollBottom) main.scrollTop = main.scrollHeight;
}

// Acha o JSON dentro da mensagem: tenta os primeiros "{" / "[{" contra os últimos "}" / "]".
function extractJson(msg) {
  const clean = String(msg ?? '').replace(/\u001b?\[(?:\d{1,3};?)+m/g, '');
  const starts = [...clean.matchAll(/\{|\[(?=\s*\{)/g)].slice(0, 8).map(m => m.index);
  const ends = [];
  for (let j = clean.length; j > 0 && ends.length < 8; j--) if (clean[j - 1] === '}' || clean[j - 1] === ']') ends.push(j);
  for (const i of starts) for (const j of ends) {
    if (j <= i) continue;
    try { return JSON.parse(clean.slice(i, j)); } catch (e) {}
  }
  return null;
}

// Árvore do JSON: objetos/arrays com [+]/[-]; abre até o 2º nível. Texto que é JSON vira nó também.
function jsonTree(val, key, depth) {
  const k = key !== undefined ? `<span class="jk">${esc(key)}</span>: ` : '';
  let v = val, note = '';
  if (typeof v === 'string') {
    const t = v.trim();
    if (t[0] === '{' || t[0] === '[') {
      try { const p = JSON.parse(t); if (p && typeof p === 'object') { v = p; note = '<span class="jnote">texto JSON</span> '; } } catch (e) {}
    }
  }
  if (v === null || typeof v !== 'object') return `<div class="jl">${k}${jsonValue(v)}</div>`;
  const arr = Array.isArray(v);
  const entries = arr ? v.map((x, i) => [i, x]) : Object.entries(v);
  const [o, c] = arr ? ['[', ']'] : ['{', '}'];
  if (!entries.length) return `<div class="jl">${k}${note}${o}${c}</div>`;
  const sum = arr ? `${entries.length} ${entries.length === 1 ? 'item' : 'itens'}` : `${entries.length} ${entries.length === 1 ? 'chave' : 'chaves'}`;
  return `<div class="jn${depth >= 2 ? ' closed' : ''}">`
    + `<div class="jl jhead"><span class="jt"></span>${k}${note}${o}<span class="jsum"> ${sum} ${c}</span></div>`
    + `<div class="jc">${entries.map(([ck, cv]) => jsonTree(cv, ck, depth + 1)).join('')}</div>`
    + `<div class="jl jclose">${c}</div></div>`;
}
function jsonValue(v) {
  if (v === null) return '<span class="jnull">null</span>';
  if (typeof v === 'string') return `<span class="js">"${highlight(esc(v))}"</span>`;
  if (typeof v === 'number') return `<span class="jnum">${v}</span>`;
  return `<span class="jb">${v}</span>`;
}

$('lista').addEventListener('click', e => {
  if (e.target.closest('.jtree, .actions')) return;
  if (String(window.getSelection())) return; // selecionando texto, não abre/fecha
  const row = e.target.closest('.line');
  if (!row) return;
  const open = row.classList.toggle('open');
  row.querySelectorAll('.jtree, .actions').forEach(n => n.remove());
  if (!open) return;
  const l = lines[row.dataset.i];
  const json = extractJson(l.message);
  const actions = document.createElement('div');
  actions.className = 'actions';
  actions.innerHTML = `<button data-a="copy">Copiar mensagem</button>`
    + (json ? '<button data-a="copyjson">Copiar JSON</button><button data-a="expand">[+] Expandir tudo</button><button data-a="collapse">[-] Recolher tudo</button>' : '')
    + `<button data-a="ctx">Ver ±30 s deste container</button>`;
  actions.addEventListener('click', ev => {
    const a = ev.target.dataset.a;
    if (a === 'copy') navigator.clipboard.writeText(l.message);
    if (a === 'copyjson') navigator.clipboard.writeText(JSON.stringify(json, null, 2));
    if (a === 'expand') row.querySelectorAll('.jn').forEach(n => n.classList.remove('closed'));
    if (a === 'collapse') row.querySelectorAll('.jtree > .jn .jn').forEach(n => n.classList.add('closed'));
    if (a === 'ctx') {
      const t = new Date(l.ts).getTime();
      const toLocal = ms => new Date(ms - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 19);
      $('periodo').value = 'custom'; $('custom').hidden = false;
      $('de').value = toLocal(t - 30000); $('ate').value = toLocal(t + 30000);
      $('q').value = ''; selected = new Set([l.container]);
      loadContainers(); search();
    }
  });
  row.appendChild(actions);
  if (json) {
    const tree = document.createElement('div');
    tree.className = 'jtree';
    tree.innerHTML = jsonTree(json, undefined, 0);
    tree.addEventListener('click', ev => {
      const head = ev.target.closest('.jhead');
      if (head && !String(window.getSelection())) head.parentElement.classList.toggle('closed');
    });
    row.appendChild(tree);
  }
});

function addToFilter(text) {
  text = text.trim();
  if (!text) return;
  const t = /\s/.test(text) ? `"${text.replace(/"/g, '')}"` : text;
  $('q').value = ($('q').value.trim() + ' ' + t).trim();
  search();
}
$('lista').addEventListener('dblclick', e => {
  if (!e.target.closest('.msg')) return;
  addToFilter(String(window.getSelection()));
  window.getSelection().removeAllRanges();
});
$('selecao').addEventListener('click', () => addToFilter(String(window.getSelection())));

// ---------- eventos ----------
$('buscar').addEventListener('click', () => { search(); loadContainers(); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') { selected.clear(); search(); loadContainers(); } });
$('url').addEventListener('change', () => { selected.clear(); loadContainers(); });
$('periodo').addEventListener('change', () => { $('custom').hidden = $('periodo').value !== 'custom'; if ($('periodo').value !== 'custom') { search(); loadContainers(); } });
$('de').addEventListener('change', search); $('ate').addEventListener('change', search);
$('tamanho').addEventListener('change', search);

renderClients();
readHash();
if ($('url').value) { search(); loadContainers(); }
</script>
</body>
</html>
